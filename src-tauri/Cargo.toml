[package]
name = "anime-viewer"
version = "1.0.0"
description = "AnimeViewer - 本地动漫追番面板（基于 Bangumi API）"
authors = ["AnimeViewer"]
edition = "2021"
rust-version = "1.77"

# v1.0-S1 T1：仅桌面端，无 lib 目标（不做移动端）

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# T1：单实例（重复启动时唤起既有窗口）+ 窗口状态记忆（尺寸/位置跨会话还原）
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# T2：请求经 Rust 侧发出（自定义 User-Agent + 免 CORS）
tauri-plugin-http = "2"
# T3：系统通知
tauri-plugin-notification = "2"

# Windows 系统代理桥接（reqwest 仅读环境变量，不读系统代理；双击启动无 shell env）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
# 面板类应用：体积优先，牺牲少量运行时性能换更小的绿色版 exe
codegen-units = 1
lto = true
opt-level = "s"
strip = true
